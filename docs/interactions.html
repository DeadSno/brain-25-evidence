<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🔗 Карта связей — brain-25-evidence</title>
<script src="https://unpkg.com/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>
<style>
:root {
  --bg: #f5f6f8;
  --fg: #1a1d21;
  --card-bg: #ffffff;
  --border: #d8dde3;
  --muted: #6a7280;
  --accent: #3d7eff;
}
body.dark {
  --bg: #14171c;
  --fg: #e8ebee;
  --card-bg: #1e2228;
  --border: #2c3138;
  --muted: #8a92a0;
  --accent: #6ba4ff;
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: var(--bg); color: var(--fg);
  transition: background .2s, color .2s;
}
header {
  padding: 1rem 1.5rem;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 1rem;
  flex-wrap: wrap;
}
header h1 { margin: 0; font-size: 1.3rem; }
header .actions { margin-left: auto; display: flex; gap: .5rem; }
.btn {
  padding: .4rem .8rem; border: 1px solid var(--border);
  background: var(--card-bg); color: var(--fg);
  border-radius: 8px; cursor: pointer; font-size: .9rem;
  text-decoration: none;
}
.btn:hover { border-color: var(--accent); }
.tabs {
  padding: 1rem 1.5rem .5rem;
  display: flex; gap: .5rem; align-items: center;
  flex-wrap: wrap;
}
.tab {
  padding: .5rem 1rem; border: 1px solid var(--border);
  background: var(--card-bg); color: var(--fg);
  border-radius: 10px; cursor: pointer; font-size: .9rem;
  font-weight: 500;
}
.tab.active {
  background: var(--accent); color: #fff; border-color: var(--accent);
}
.tabs .spacer { flex: 1; }
#search {
  padding: .4rem .8rem; border: 1px solid var(--border);
  background: var(--card-bg); color: var(--fg);
  border-radius: 8px; font-size: .9rem; min-width: 200px;
}
.legend {
  padding: .5rem 1.5rem;
  display: flex; gap: 1rem; flex-wrap: wrap;
  font-size: .8rem; color: var(--muted);
}
.legend span::before {
  content: ''; display: inline-block;
  width: 10px; height: 10px; border-radius: 50%;
  margin-right: .35rem; vertical-align: middle;
}
.legend .syn::before  { background: #4caf50; }
.legend .ant::before  { background: #e53935; }
.legend .int::before  { background: #ff9800; }
.legend .sup::before  { background: #3d7eff; }
.legend .drug::before { background: #9e9e9e; }
#graph {
  width: 100%; height: calc(100vh - 220px); min-height: 500px;
  background: var(--card-bg);
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
}
footer {
  padding: 1rem 1.5rem;
  font-size: .8rem; color: var(--muted);
}
footer a { color: var(--accent); }
#hint {
  padding: .5rem 1.5rem; font-size: .85rem; color: var(--muted);
}
</style>
</head>
<body>
<header>
  <h1>🔗 Карта связей БАДов</h1>
  <div class="actions">
    <a class="btn" href="index.html">← На главную</a>
    <button class="btn" id="themeToggle">🌙 Тёмная тема</button>
  </div>
</header>

<div class="tabs">
  <button class="tab active" data-mode="supplements">Добавки между собой</button>
  <button class="tab" data-mode="drugs">Добавки и лекарства</button>
  <div class="spacer"></div>
  <input id="search" placeholder="🔍 Поиск добавки или лекарства…">
</div>

<div class="legend" id="legend"></div>
<div id="hint">Кликните узел — увидите связи. Колёсико — масштаб. Тяните фон — сдвиг.</div>
<div id="graph"></div>
<footer>
  Источник: <code>docs/interactions_graph.json</code> (сгенерирован из
  <code>docs/data.json</code>). Связи показывают <b>известные взаимодействия</b>,
  не медицинские рекомендации. <a href="methodology.html">Методология аудита →</a>
</footer>

<script>
const state = {
  mode: 'supplements',
  graph: null,
  network: null,
  data: null,
  searchQuery: ''
};

const GRADE_COLOR = { A: '#4caf50', B: '#8bc34a', C: '#ff9800', D: '#e53935' };
const SEV_COLOR = { low: '#ff9800', medium: '#ff7043', high: '#e53935', critical: '#b71c1c' };
const TYPE_COLOR = { synergy: '#4caf50', antagonist: '#e53935', interaction: null };

function isDark() { return document.body.classList.contains('dark'); }

function lighten(hex, amt) {
  // простая аппроксимация для тёмной темы — оставляем как есть
  return hex;
}

function buildNodes(mode) {
  const nodes = [];
  const raw = mode === 'supplements'
    ? state.data.supplements.nodes
    : state.data.drugs.nodes;

  for (const n of raw) {
    let color = '#3d7eff';
    if (n.kind === 'drug') color = '#9e9e9e';
    else if (n.grade) color = GRADE_COLOR[n.grade] || '#3d7eff';

    nodes.push({
      id: n.id,
      label: n.label,
      title: n.kind === 'drug' ? 'Лекарственный класс' : (n.grade ? 'Грейд ' + n.grade : ''),
      color: { background: color, border: color, highlight: { background: '#ffeb3b', border: '#333' } },
      font: { color: isDark() ? '#e8ebee' : '#1a1d21' },
      shape: 'dot',
      size: n.kind === 'drug' ? 14 : 20
    });
  }
  return nodes;
}

function buildEdges(mode) {
  const raw = mode === 'supplements'
    ? state.data.supplements.edges
    : state.data.drugs.edges;

  return raw.map(e => {
    let color = TYPE_COLOR[e.type] || SEV_COLOR[e.severity] || '#888';
    const isDrugEdge = mode === 'drugs';
    return {
      from: e.from,
      to: e.to,
      color: { color, highlight: '#ffeb3b' },
      width: e.severity === 'critical' ? 3 : e.severity === 'high' ? 2.5 : 1.5,
      dashes: e.type === 'synergy',
      title: (e.note || '').replace(/</g, '&lt;') ||
             (e.type === 'synergy' ? 'Синергия' :
              e.type === 'antagonist' ? 'Антагонизм' :
              'Взаимодействие · ' + (e.severity || '')),
      arrows: isDrugEdge ? { to: { enabled: true, scaleFactor: 0.5 } } : undefined
    };
  });
}

function renderLegend(mode) {
  const el = document.getElementById('legend');
  if (mode === 'supplements') {
    el.innerHTML =
      '<span class="syn">синергия</span>' +
      '<span class="ant">антагонизм</span>' +
      '<span class="int">взаимодействие</span>' +
      '<span class="sup">добавка (цвет = грейд A–D)</span>';
  } else {
    el.innerHTML =
      '<span class="int">взаимодействие · цвет = severity</span>' +
      '<span class="sup">добавка (цвет = грейд)</span>' +
      '<span class="drug">лекарственный класс</span>';
  }
}

function applySearch(nodes, edges, query) {
  if (!query) return { nodes, edges };
  const q = query.toLowerCase();
  const matched = new Set();
  for (const n of nodes) {
    if (n.label.toLowerCase().includes(q)) matched.add(n.id);
  }
  // связанные
  for (const e of edges) {
    if (matched.has(e.from)) matched.add(e.to);
    if (matched.has(e.to)) matched.add(e.from);
  }
  return {
    nodes: nodes.map(n => ({ ...n, hidden: !matched.has(n.id) })),
    edges: edges.map(e => ({
      ...e,
      hidden: !matched.has(e.from) && !matched.has(e.to)
    }))
  };
}

function drawGraph() {
  const container = document.getElementById('graph');
  const mode = state.mode;

  const allNodes = buildNodes(mode);
  const allEdges = buildEdges(mode);
  const filtered = applySearch(allNodes, allEdges, state.searchQuery);

  if (state.network) {
    state.network.destroy();
    state.network = null;
  }

  const options = {
    physics: {
      enabled: true,
      stabilization: { iterations: 200 },
      barnesHut: { gravitationalConstant: -8000, springLength: 150, springConstant: 0.04 }
    },
    interaction: {
      hover: true, tooltipDelay: 150, navigationButtons: false, keyboard: false
    },
    edges: { smooth: { type: 'continuous', roundness: 0.4 } },
    nodes: { borderWidth: 2 }
  };

  state.network = new vis.Network(
    container,
    { nodes: new vis.DataSet(filtered.nodes), edges: new vis.DataSet(filtered.edges) },
    options
  );

  state.network.on('click', params => {
    if (params.nodes.length === 1) {
      const id = params.nodes[0];
      if (state.data.supplements.nodes.some(n => n.id === id) ||
          state.data.drugs.nodes.some(n => n.id === id && n.kind !== 'drug')) {
        window.open('index.html?s=' + encodeURIComponent(id), '_blank');
      }
    }
  });
}

function setMode(mode) {
  state.mode = mode;
  document.querySelectorAll('.tab').forEach(t =>
    t.classList.toggle('active', t.dataset.mode === mode));
  renderLegend(mode);
  drawGraph();
}

function setDark(on) {
  document.body.classList.toggle('dark', on);
  localStorage.setItem('theme', on ? 'dark' : 'light');
  document.getElementById('themeToggle').textContent = on ? '☀ Светлая тема' : '🌙 Тёмная тема';
  if (state.network) drawGraph();
}

document.querySelectorAll('.tab').forEach(t =>
  t.addEventListener('click', () => setMode(t.dataset.mode)));

document.getElementById('themeToggle').onclick = () => setDark(!isDark());
document.getElementById('search').addEventListener('input', e => {
  state.searchQuery = e.target.value.trim();
  drawGraph();
});

const saved = localStorage.getItem('theme');
if (saved === 'light') setDark(false);
else setDark(true);

fetch('interactions_graph.json')
  .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
  .then(d => {
    state.data = d;
    setMode('supplements');
  })
  .catch(err => {
    document.getElementById('graph').innerHTML =
      '<p style="padding:2rem;color:#e53935">Не удалось загрузить interactions_graph.json: ' +
      err.message + '</p>';
  });
</script>
</body>
</html>
