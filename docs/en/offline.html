<!--
  Страница отдаётся service worker'ом, когда пользователь офлайн открывает
  адрес, которого нет в кэше (docs/sw.js, cacheFirstForStatic).

  Стили инлайновые, style.css намеренно не подключается: разметка не должна
  зависеть от файла, которого может не оказаться в кэше.
  Внешних ресурсов ровно три, и все три лежат в прекеше sw.js (STATIC_ASSETS):
  manifest.webmanifest, i18n.js и pwa.js. Их отдаёт сам service worker из кэша,
  а не сеть, поэтому офлайн они доступны. В прежней редакции этого комментария
  было написано «без внешних <link> и <script>», хотя manifest и pwa.js уже
  стояли; после FIX-63 к ним добавился i18n.js — без него pwa.js падал на t().
-->
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    padding: max(24px, env(safe-area-inset-top)) 20px
             max(24px, env(safe-area-inset-bottom));
    display: flex; align-items: center; justify-content: center;
    background: #f5f5f7; color: #1c1c1e;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #1c1c1e; color: #f5f5f7; }
    .card { background: #2c2c2e; border-color: #3a3a3c; }
    .hint  { color: #a1a1a6; }
    .btn   { background: #0a84ff; }
  }
  .card {
    width: 100%; max-width: 460px; text-align: center;
    background: #fff; border: 1px solid #d1d1d6; border-radius: 16px;
    padding: 32px 24px;
  }
  .logo { font-size: 2rem; line-height: 1; margin-bottom: 12px; }
  h1 { font-size: 1.3rem; font-weight: 600; margin: 0 0 10px; }
  p  { font-size: .95rem; line-height: 1.55; margin: 0 0 8px; }
  .hint { color: #6e6e73; font-size: .875rem; margin-bottom: 22px; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center;
    /* 44px — не ниже порога тап-таргета (WCAG 2.5.5) */
    min-height: 44px; min-width: 44px;
    padding: 10px 22px; border: none; border-radius: 10px;
    background: #0062cc; color: #fff;
    font-size: .95rem; font-weight: 600;
    text-decoration: none; cursor: pointer;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  .btn:active { filter: brightness(.92); }
  a:focus-visible, button:focus-visible { outline: 2px solid #0a84ff; outline-offset: 3px; }
  .links { margin-top: 22px; font-size: .875rem; line-height: 2; }
  .links a { color: inherit; text-decoration: none; border-bottom: 1px solid currentColor; }
  @media (prefers-reduced-motion: no-preference) {
    .btn { transition: filter .15s; }
  }
</style>
</head>
<body>
<main class="card">
  <div class="logo" aria-hidden="true">🧠</div>
  <h1><span>No connection</span></h1>
  <p><span>The page</span> <strong id="path"><span>was not found</span></strong> <span>is not saved on this device yet, so there is nothing to show offline.</span></p>
  <p class="hint"><span>Pages already loaded keep working. When the connection is back, refresh and everything returns.</span></p>
  <button class="btn" id="retry" type="button"><span>Refresh</span></button>
  <p class="links"><a href="../index.html"><span>Home</span></a></p>
</main>
<script>
  // Показываем, какой именно адрес не нашёлся в кэше.
  (function () {
    var p = location.pathname.split('/').pop() || location.pathname;
    var el = document.getElementById('path');
    if (el) el.textContent = p;
  })();

  document.getElementById('retry').addEventListener('click', function () {
    location.reload();
  });
</script>
<!-- v5.6.5 FIX-63: pwa.js стоял без i18n.js, хотя подпись плашки офлайна
     берёт через t('pwa.offline') (i18n.js:1200). Ровно на этой странице
     офлайн гарантирован, поэтому ReferenceError случался бы всегда, а не
     изредка. Порядок держится на типе подключения: без defer — сразу. -->
<script src="../i18n.js?v=25" defer></script>
<script src="../pwa.js?v=284" defer></script>
</body>
