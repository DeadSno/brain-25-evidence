<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карта механизмов БАДов — цена vs наука</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
<script>try{if(localStorage.getItem('theme')!=='light'){document.addEventListener('DOMContentLoaded',function(){document.body.classList.add('dark');var b=document.getElementById('themeBtn');if(b)b.textContent='☀️ Светлая тема';});}}catch(e){}</script>
<link rel="stylesheet" href="style.css?v=1.3.2">
<style>
  .wrap{max-width:1200px;margin:0 auto;padding:1.2rem}
  .top{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
  .top h1{font-size:1.45rem;margin:.2rem 0}
  .top a{color:inherit;text-decoration:none}
  #q{padding:.5rem .8rem;border:1px solid var(--border,#444);border-radius:8px;background:var(--panel,#1b1b1b);color:var(--text,#eee);min-width:220px}
  #themeBtn{padding:.5rem .8rem;border:1px solid var(--border,#444);border-radius:8px;background:var(--panel,#1b1b1b);color:var(--text,#eee);cursor:pointer}
  .cols{display:grid;grid-template-columns:340px 1fr;gap:1.2rem;margin-top:1rem}
  @media(max-width:860px){.cols{grid-template-columns:1fr}}
  .list{max-height:78vh;overflow:auto;padding-right:.4rem}
  .cat h3{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;opacity:.55;margin:.8rem 0 .35rem}
  .chip{display:inline-block;margin:0 .3rem .3rem 0;padding:.32rem .65rem;border:1px solid var(--border,#444);border-radius:999px;cursor:pointer;font-size:.82rem;background:var(--panel,#1b1b1b);color:var(--text,#eee)}
  .chip:hover{border-color:#888}
  .chip.on{border-color:#f1c40f;color:#f1c40f;font-weight:700}
  .chainbox{border:1px solid var(--border,#333);border-radius:14px;padding:1.1rem 1.2rem;background:var(--panel,#181818);min-height:60vh}
  .step{padding:.7rem .95rem;border-radius:10px;margin:.35rem 0;font-size:.93rem;line-height:1.5}
  .step.sup{background:rgba(52,152,219,.14);border:1px solid rgba(52,152,219,.45)}
  .step.mech{background:rgba(155,89,182,.13);border:1px solid rgba(155,89,182,.45)}
  .step.eff{background:rgba(46,204,113,.11);border:1px solid rgba(46,204,113,.4)}
  .arrow{text-align:center;opacity:.5;font-size:1.05rem;margin:.05rem 0}
  .tag{display:inline-block;padding:.14rem .55rem;border-radius:999px;font-size:.72rem;font-weight:800;color:#111;margin-left:.5rem;vertical-align:middle}
  .verdict{display:inline-block;padding:.2rem .6rem;border-radius:6px;color:#fff;font-size:.8rem;font-weight:700}
  .verdict.v1{background:linear-gradient(135deg,#1e8e4e,#2ecc71)}
  .verdict.v0{background:linear-gradient(135deg,#b7791f,#f1c40f)}
  .verdict.v-1{background:linear-gradient(135deg,#a93226,#e74c3c)}
  .chainbox a{color:#3498db}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1><a href="index.html">🧠 Карта механизмов БАДов</a> <span style="opacity:.5;font-size:.9rem">v5 · атлас</span></h1>
    <div style="display:flex;gap:.6rem;flex-wrap:wrap">
      <input id="q" placeholder="🔍 Поиск добавки...">
      <button id="themeBtn">🌙 Тёмная тема</button>
    </div>
  </header>
  <p style="opacity:.65;margin:.6rem 0 0">Выбери добавку слева — справа её цепочка: вещество → молекулярная мишень → эффект, с силой доказательств.</p>
  <div class="cols">
    <div class="list" id="list"></div>
    <div class="chainbox" id="chain"></div>
  </div>
</div>
<script>
const STRENGTH = {'сильно':'#2ecc71','умеренно':'#7fb800','слабо':'#e67e22','контекст':'#f1c40f','маркетинг':'#e74c3c'};
let SUPS = [];
function select(id){
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.id === id));
  const s = SUPS.find(x => x.id === id);
  if (!s) return;
  const mechs = s.mechs || s.mech || [];
  document.getElementById('chain').innerHTML =
    '<h2 style="margin:.2rem 0 .4rem">' + s.name + '</h2>' +
    '<span class="verdict v' + s.code + '">' + s.verdict + '</span> ' +
    '<span style="opacity:.6;font-size:.85rem">' + s.category + '</span>' +
    (mechs.length ? mechs.map(m =>
      '<div class="step sup">💊 <b>' + s.name + '</b></div>' +
      '<div class="arrow">↓</div>' +
      '<div class="step mech">🎯 ' + m[0] + '</div>' +
      '<div class="arrow">↓</div>' +
      '<div class="step eff">✨ ' + m[1] +
        '<span class="tag" style="background:' + (STRENGTH[m[2]] || '#888') + '">' + m[2] + '</span></div>'
    ).join('<div style="height:1.1rem"></div>')
    : '<p style="opacity:.6">Для этой добавки механизмы ещё уточняются.</p>') +
    '<p style="margin-top:1.2rem"><a href="index.html#sup=' + encodeURIComponent(s.id) + '">Открыть карточку добавки →</a></p>';
}
fetch('data.json?ts=' + Date.now()).then(r => r.json()).then(data => {
  SUPS = data;
  const cats = {};
  data.forEach(s => { (cats[s.category] = cats[s.category] || []).push(s); });
  document.getElementById('list').innerHTML = Object.keys(cats).sort().map(c =>
    '<div class="cat"><h3>' + c + '</h3>' +
    cats[c].map(s => '<span class="chip" data-id="' + s.id + '">' + s.name + '</span>').join('') +
    '</div>').join('');
  document.getElementById('list').addEventListener('click', e => {
    const ch = e.target.closest('.chip');
    if (ch) select(ch.dataset.id);
  });
  document.getElementById('q').addEventListener('input', e => {
    const q = e.target.value.toLowerCase();
    document.querySelectorAll('.chip').forEach(ch =>
      ch.style.display = ch.textContent.toLowerCase().includes(q) ? '' : 'none');
  });
  select('Креатин');
});
document.getElementById('themeBtn').addEventListener('click', () => {
  const dark = !document.body.classList.contains('dark');
  document.body.classList.toggle('dark', dark);
  localStorage.setItem('theme', dark ? 'dark' : 'light');
  document.getElementById('themeBtn').textContent = dark ? '☀️ Светлая тема' : '🌙 Тёмная тема';
});
</script>
</body>
</html>
