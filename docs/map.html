/* ---- радиальный layout: 8 категорий по кругу, добавки кольцом, механизмы/эффекты цепочкой наружу ---- */
const CAT_R=400, RM=52, RE=46, pos={};
const byCat={};
DATA.nodes.forEach(n=>{if(n.shape==='dot'&&n.category)(byCat[n.category]=byCat[n.category]||[]).push(n);});
DATA.categories.forEach((c,i)=>{
  const a0=(i/DATA.categories.length)*2*Math.PI;
  const cx=Math.cos(a0)*CAT_R, cy=Math.sin(a0)*CAT_R;
  const list=byCat[c]||[];
  const rs=Math.max(78,(list.length*26)/(2*Math.PI));
  list.forEach((n,j)=>{
    const a=a0+(j/list.length)*2*Math.PI;
    pos[n.id]={x:cx+Math.cos(a)*rs,y:cy+Math.sin(a)*rs,out:a};
  });
});
DATA.nodes.forEach(n=>{
  if(n.shape!=='dot'||!pos[n.id])return;
  const sups=edges.get().filter(e=>e.from===n.id);
  sups.forEach((me,i)=>{
    const k=sups.length, fan=(i-(k-1)/2)*14*Math.PI/180;
    const ang=pos[n.id].out+fan;
    if(!pos[me.to])pos[me.to]={x:pos[n.id].x+Math.cos(ang)*RM,y:pos[n.id].y+Math.sin(ang)*RM,out:ang};
    const efs=edges.get().filter(ef=>ef.from===me.to);
    efs.forEach((ef,j)=>{
      const ea=(efs.length>1)?ang+(j-(efs.length-1)/2)*10*Math.PI/180:ang;
      if(!pos[ef.to])pos[ef.to]={x:pos[me.to].x+Math.cos(ea)*RE,y:pos[me.to].y+Math.sin(ea)*RE};
    });
  });
});
nodes.forEach(n=>{
  if(pos[n.id]){n.x=pos[n.id].x;n.y=pos[n.id].y;n.fixed={x:true,y:true};}
  if(n.shape!=='dot')n.label='';
});

let focused=null;
function chainOf(root){
  const ns=new Set([root]), es=new Set(), q=[root];
  while(q.length){
    const cur=q.pop();
    edges.get().forEach(e=>{if(e.from===cur&&!ns.has(e.to)){ns.add(e.to);es.add(e.id);q.push(e.to);}});
  }
  return {ns,es};
}
function edgePath(root){
  const out=[], all=edges.get();
  all.filter(e=>e.from===root).forEach(me=>{
    const effs=all.filter(e=>e.from===me.to);
    if(effs.length)effs.forEach(ef=>out.push(root+' → <span style="color:#8e44ad">'+me.to+'</span> → <span style="color:#2980b9">'+ef.to+'</span>'));
    else out.push(root+' → <span style="color:#8e44ad">'+me.to+'</span>');
  });
  if(!out.length)out.push(root);
  return out;
}
function rootOf(id){
  const up1=edges.get().filter(e=>e.to===id);
  if(!up1.length)return null;
  const a=up1[0].from;
  if(nodes.get(a).shape==='dot')return a;
  const up2=edges.get().filter(e=>e.to===a);
  return up2.length?up2[0].from:null;
}
function focusMode(id){
  const {ns,es}=chainOf(id);
  nodes.update(DATA.nodes.map(n=>({id:n.id,opacity:ns.has(n.id)?1:0.12,
    label:ns.has(n.id)?((n.shape==='dot')?n.label:n.rawLabel):((n.shape==='dot')?n.label:'')})));
  edges.update(DATA.edges.map(e=>({id:e.id,
    color:es.has(e.id)?{color:'#f1c40f',opacity:1}:{color:'#9aa0b0',opacity:.06},
    width:es.has(e.id)?5:1.4,hidden:false})));
  focused=id;
  let h='<h2>'+id+'</h2>';
  const v=VDATA[id];
  if(v)h+='<span class="vtag v'+v.code+'">'+VERDICT[v.code][0]+'</span><br>';
  edgePath(id).forEach(l=>h+='<div class="route"><b>'+l+'</b></div>');
  h+='<a class="cardLink" href="index.html#sup='+encodeURIComponent(id)+'">Открыть карточку →</a>';
  info.innerHTML=h;
  net.focus(id,{scale:1.5});
}
function showAll(){
  catFilter.value='all';
  nodes.update(DATA.nodes.map(n=>({id:n.id,opacity:1,hidden:false,label:(n.shape==='dot')?n.label:''})));
  edges.update(DATA.edges.map(e=>({id:e.id,color:e.color,width:e.width,hidden:false})));
  focused=null;
  info.innerHTML='<p>Кликни по кругу добавки — останется её цепочка.</p>';
  net.fit({animation:true});
}
btnShowAll.onclick=showAll;

net.on('click',p=>{
  if(!p.nodes.length){showAll();return;}
  const id=p.nodes[0];
  if(nodes.get(id).shape==='dot')focusMode(id);
  else{const r=rootOf(id);if(r)focusMode(r);}
});
net.on('hoverNode',p=>{
  const n=nodes.get(p.node);
  if(n.shape!=='dot')nodes.update({id:p.node,label:n.rawLabel,font:fontOf()});
});
net.on('blurNode',p=>{
  const n=nodes.get(p.node);
  if(n.shape!=='dot'&&!(focused&&chainOf(focused).ns.has(p.node)))nodes.update({id:p.node,label:''});
});

catFilter.onchange=()=>{
  const c=catFilter.value;
  const hid=new Set(DATA.nodes.filter(n=>c!=='all'&&(n.category||'')!==c).map(n=>n.id));
  nodes.update(DATA.nodes.map(n=>({id:n.id,hidden:hid.has(n.id)})));
  edges.update(DATA.edges.map(e=>({id:e.id,hidden:hid.has(e.from)||hid.has(e.to)})));
  focused=null;
  net.fit({animation:true});
};
search.oninput=()=>{
  const q=search.value.toLowerCase();if(!q)return;
  const hit=DATA.nodes.find(n=>n.shape==='dot'&&n.id.toLowerCase().includes(q));
  if(hit)focusMode(hit.id);
};

fetch('data.json?ts='+Date.now()).then(r=>r.json()).then(d=>{
  d.forEach(s=>{VDATA[s.id]=s;});
  nodes.update(DATA.nodes.filter(n=>VDATA[n.id]).map(n=>{
    const c=VDATA[n.id].code, v=VERDICT[c]||['—','#2ecc71'];
    return {id:n.id,color:v[1],title:VDATA[n.id].name+' · '+(VDATA[n.id].category||'')+'\nВердикт: '+v[0]+' | индекс науки: '+VDATA[n.id].scienceIndex};
  }));
  net.fit({animation:true});
}).catch(()=>{});
net.fit({animation:true});
</script></body></html>
