<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Карта механизмов БАДов — цена vs наука</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧠</text></svg>">
<script>try{if(localStorage.getItem('theme')!=='light'){document.addEventListener('DOMContentLoaded',function(){document.body.classList.add('dark');var b=document.getElementById('themeBtn');if(b)b.textContent='☀️ Светлая тема';});}}catch(e){}</script>
<link rel="stylesheet" href="style.css?v=1.3.2">
<style>
  body{--apanel:#15171c;--aborder:#2b2e35;--atext:#e9eaee;--amut:#9aa0aa;margin:0}
  body:not(.dark){--apanel:#ffffff;--aborder:#d9dde3;--atext:#1b1d22;--amut:#5c6370}
  .wrap{max-width:1200px;margin:0 auto;padding:1.2rem;color:var(--atext)}
  .top{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap}
  .top h1{font-size:1.45rem;margin:.2rem 0}
  .top a{color:inherit;text-decoration:none}
  #stats{opacity:.6;font-size:.85rem;margin:.3rem 0 0}
  #q{padding:.5rem .8rem;border:1px solid var(--aborder);border-radius:8px;background:var(--apanel);color:var(--atext);min-width:220px}
  #themeBtn{padding:.5rem .8rem;border:1px solid var(--aborder);border-radius:8px;background:var(--apanel);color:var(--atext);cursor:pointer}
  .cols{display:grid;grid-template-columns:340px 1fr;gap:1.2rem;margin-top:1rem}
  @media(max-width:860px){.cols{grid-template-columns:1fr}}
  .list{max-height:78vh;overflow:auto;padding-right:.4rem}
  .cat h3{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;opacity:.55;margin:.8rem 0 .35rem;cursor:pointer;user-select:none}
  .cat h3:hover{opacity:.9}
  .cat.closed .chip{display:none!important}
  .chip{display:inline-block;margin:0 .3rem .3rem 0;padding:.32rem .65rem;border:1px solid var(--aborder);border-radius:999px;cursor:pointer;font-size:.82rem;background:var(--apanel);color:var(--atext)}
  .chip:hover{border-color:#888}
  .chip.on{border-color:#f1c40f;color:#f1c40f;font-weight:700}
  .chainbox{border:1px solid var(--aborder);border-radius:14px;padding:1.1rem 1.2rem;background:var(--apanel);min-height:40vh}
  @keyframes rise{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}
  .step{padding:.7rem .95rem;border-radius:10px;margin:.35rem 0;font-size:.93rem;line-height:1.5;
        backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:rise .35s ease both}
  .step.sup{background:rgba(52,152,219,.16);border:1px solid rgba(52,152,219,.5)}
  .step.mech{background:rgba(155,89,182,.15);border:1px solid rgba(155,89,182,.5)}
  .step.eff{background:rgba(46,204,113,.13);border:1px solid rgba(46,204,113,.45)}
  .arrow{text-align:center;opacity:.5;font-size:1.05rem;margin:.05rem 0;animation:rise .3s ease both}
  .tag{display:inline-block;padding:.14rem .55rem;border-radius:999px;font-size:.72rem;font-weight:800;color:#fff;
       margin-left:.5rem;vertical-align:middle;text-shadow:0 1px 2px rgba(0,0,0,.35)}
  .t-strong{background:linear-gradient(135deg,#1e8e4e,#2ecc71);box-shadow:0 0 10px rgba(46,204,113,.45)}
  .t-mod{background:linear-gradient(135deg,#5d8a1a,#7fb800)}
  .t-weak{background:linear-gradient(135deg,#b3541e,#e67e22)}
  .t-ctx{background:linear-gradient(135deg,#b7791f,#f1c40f);color:#222;text-shadow:none}
  .t-mkt{background:linear-gradient(135deg,#a93226,#e74c3c);box-shadow:0 0 10px rgba(231,76,60,.4)}
  .verdict{display:inline-block;padding:.2rem .6rem;border-radius:6px;color:#fff;font-size:.8rem;font-weight:700}
  .verdict.v1{background:linear-gradient(135deg,#1e8e4e,#2ecc71)}
  .verdict.v0{background:linear-gradient(135deg,#b7791f,#f1c40f)}
  .verdict.v-1{background:linear-gradient(135deg,#a93226,#e74c3c)}
  .chainbox a{color:#3498db}
  .sim{margin-top:1.2rem;padding-top:.9rem;border-top:1px dashed var(--aborder);animation:rise .4s ease both}
  .sim h4{margin:.2rem 0 .5rem;font-size:.85rem;opacity:.75}
  kbd{border:1px solid var(--aborder);border-radius:4px;padding:0 .3rem;font-size:.75rem;opacity:.7}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1><a href="index.html">🧠 Карта механизмов БАДов</a> <span style="opacity:.5;font-size:.9rem">v5.1 · атлас</span></h1>
    <div style="display:flex;gap:.6rem;flex-wrap:wrap">
      <input id="q" placeholder="🔍 Поиск добавки...  ( / )">
      <button id="themeBtn">🌙 Тёмная тема</button>
    </div>
  </header>
  <p id="stats"></p>
  <p style="opacity:.65;margin:.4rem 0 0">Выбери добавку слева — справа её цепочка: вещество → молекулярная мишень → эффект. <kbd>↑</kbd><kbd>↓</kbd> навигация, <kbd>/</kbd> поиск, <kbd>Esc</kbd> сброс.</p>
  <div class="cols">
    <div class="list" id="list"></div>
    <div class="chainbox" id="chain"></div>
  </div>
</div>
<script>
const TAGCLASS = {'сильно':'t-strong','умеренно':'t-mod','слабо':'t-weak','контекст':'t-ctx','маркетинг':'t-mkt'};
let SUPS = [], cur = null;
const $ = id => document.getElementById(id);

function similar(s){
  const targets = new Set((s.mechs || []).map(m => m[0]));
  return SUPS.filter(x => x.id !== s.id && (x.mechs || []).some(m => targets.has(m[0]))).slice(0, 5);
}

function select(id, push){
  const s = SUPS.find(x => x.id === id);
  if (!s) return;
  cur = id;
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', c.dataset.id === id));
  if (push !== false) { try { history.pushState(null, '', '?supplement=' + encodeURIComponent(id)); } catch(e){} }
  const mechs = s.mechs || s.mech || [];
  let d = 0.05, html =
    '<h2 style="margin:.2rem 0 .4rem;animation:rise .3s ease both">' + s.name + '</h2>' +
    '<span class="verdict v' + s.code + '">' + s.verdict + '</span> ' +
    '<span style="opacity:.6;font-size:.85rem">' + s.category + '</span>';
  if (mechs.length) {
    html += mechs.map(m => {
      const blk =
        '<div class="step sup" style="animation-delay:' + (d) + 's">💊 <b>' + s.name + '</b></div>' +
        '<div class="arrow" style="animation-delay:' + (d + 0.12) + 's">↓</div>' +
        '<div class="step mech" style="animation-delay:' + (d + 0.24) + 's">🎯 ' + m[0] + '</div>' +
        '<div class="arrow" style="animation-delay:' + (d + 0.36) + 's">↓</div>' +
        '<div class="step eff" style="animation-delay:' + (d + 0.48) + 's">✨ ' + m[1] +
          '<span class="tag ' + (TAGCLASS[m[2]] || 't-ctx') + '">' + m[2] + '</span></div>';
      d += 0.65;
      return blk;
    }).join('<div style="height:1.1rem"></div>');
  } else {
    html += '<p style="opacity:.6">Для этой добавки механизмы ещё уточняются.</p>';
  }
  const sim = similar(s);
  if (sim.length) {
    html += '<div class="sim" style="animation-delay:' + (d + 0.2) + 's"><h4>🔗 Также бьёт по этим мишеням:</h4>' +
      sim.map(x => '<span class="chip" data-id="' + x.id + '">' + x.name + '</span>').join('') + '</div>';
  }
  html += '<p style="margin-top:1.2rem"><a href="index.html#sup=' + encodeURIComponent(s.id) + '">Открыть карточку добавки →</a></p>';
  $('chain').innerHTML = html;
}

fetch('data.json?ts=' + Date.now()).then(r => r.json()).then(data => {
  SUPS = data;
  const cats = {};
  data.forEach(s => { (cats[s.category] = cats[s.category] || []).push(s); });
  const targets = new Set(), effects = new Set();
  data.forEach(s => (s.mechs || []).forEach(m => { targets.add(m[0]); effects.add(m[1]); }));
  $('stats').textContent = data.length + ' добавка · ' + Object.keys(cats).length + ' категорий · ' +
    targets.size + ' мишеней · ' + effects.size + ' эффектов';
  let closed = [];
  try { closed = JSON.parse(localStorage.getItem('mapClosed') || '[]'); } catch(e){}
  $('list').innerHTML = Object.keys(cats).sort().map(c =>
    '<div class="cat' + (closed.includes(c) ? ' closed' : '') + '"><h3>' + c + ' ▾</h3>' +
    cats[c].map(s => '<span class="chip" data-id="' + s.id + '">' + s.name + '</span>').join('') +
    '</div>').join('');
  const p = new URLSearchParams(location.search).get('supplement');
  select(p && SUPS.some(s => s.id === p) ? p : 'Креатин', false);
});

$('list').addEventListener('click', e => {
  const h = e.target.closest('h3');
  if (h) {
    const cat = h.parentElement;
    cat.classList.toggle('closed');
    const closed = [...document.querySelectorAll('.cat.closed h3')].map(x => x.textContent.replace(' ▾', ''));
    localStorage.setItem('mapClosed', JSON.stringify(closed));
    return;
  }
  const ch = e.target.closest('.chip');
  if (ch) select(ch.dataset.id);
});
$('chain').addEventListener('click', e => {
  const ch = e.target.closest('.chip');
  if (ch) select(ch.dataset.id);
});
$('q').addEventListener('input', e => {
  const q = e.target.value.toLowerCase();
  document.querySelectorAll('#list .chip').forEach(ch =>
    ch.style.display = ch.textContent.toLowerCase().includes(q) ? '' : 'none');
});
window.addEventListener('popstate', () => {
  const p = new URLSearchParams(location.search).get('supplement');
  select(p && SUPS.some(s => s.id === p) ? p : 'Креатин', false);
});
document.addEventListener('keydown', e => {
  const q = $('q');
  if (e.key === '/' && document.activeElement !== q) { e.preventDefault(); q.focus(); return; }
  if (e.key === 'Escape') { q.value = ''; q.blur(); document.querySelectorAll('#list .chip').forEach(c => c.style.display = ''); return; }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    const vis = [...document.querySelectorAll('#list .chip')].filter(c => c.style.display !== 'none');
    if (!vis.length) return;
    let i = vis.findIndex(c => c.classList.contains('on'));
    i = e.key === 'ArrowDown' ? Math.min(vis.length - 1, i + 1) : Math.max(0, i - 1);
    select(vis[i].dataset.id);
    vis[i].scrollIntoView({ block: 'nearest' });
  }
  if (e.key === 'Enter' && document.activeElement !== q && cur) {
    location.href = 'index.html#sup=' + encodeURIComponent(cur);
  }
});
$('themeBtn').addEventListener('click', () => {
  const dark = !document.body.classList.contains('dark');
  document.body.classList.toggle('dark', dark);
  localStorage.setItem('theme', dark ? 'dark' : 'light');
  $('themeBtn').textContent = dark ? '☀️ Светлая тема' : '🌙 Тёмная тема';
});
</script>
</body>
</html>
