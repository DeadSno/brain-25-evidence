name: Daily backup

# ── Зачем и почему так ───────────────────────────────────────────────────────
# docs/*.json — источник правды сайта. Потеря любого из них означает либо
# пустую страницу при HTTP 200 (файл запрашивается по fetch), либо молчащее
# отключение проверки (файл читает тест). Оба класса отказов невидимы для
# мониторинга по коду ответа.
#
# Бэкап идёт в GitHub Artifacts, а НЕ в git history. Причина измерена:
# 2 275 992 байта за прогон × 30 дней = 65.0 МиБ. В git это была бы
# история, которую не убрать: `find -delete` чистит рабочую копию, но блобы
# остаются в коммитах навсегда, а `git gc` не умеет их выкинуть. За год —
# около 0.77 ГиБ, и столько же в каждом полном клоне. Artifacts живут
# ровно retention-days и исчезают, не оставляя следа в репозитории.
#
# Бэкапится ВСЁ, что матчится (*.json плюс openapi.yaml — контракт, по
# которому валидирует tests/test_api_contract.py). Перечислять файлы поимённо
# смысла нет: новый json под docs/ должен попадать в бэкап без правки
# этого файла.
#
# Квоты: GitHub free даёт 500 МБ хранилища артефактов. При 30 днях хранения
# расход — 65.0 МиБ, это 13% квоты.
#
# ВОССТАНОВЛЕНИЕ. Артефакты лежат в интерфейсе, файла в git нет:
#   Actions -> Daily backup -> нужный прогон -> Artifacts -> скачать zip
# Файл вернуть на место: unzip и скопировать содержимое так, чтобы
# `docs/api/v1/index.json` снова оказался по этому пути. Структура внутри
# артефакта повторяет путь в репозитории, поэтому распаковывать в корень
# репозитория — правильный и достаточный шаг.
#
# ПРОВЕРКА РАБОТЫ: Actions -> Daily backup -> Run workflow. После прогона
# в секции Artifacts должен появиться архив с 20 файлами.

on:
  schedule:
    # 03:00 UTC ежедневно. GitHub запускает по расписанию с задержкой до
    # нескольких минут и может пропустить запуск при высокой нагрузке;
    # для бэкапа это не критично, данные меняются раз в сутки.
    - cron: '0 3 * * *'
  workflow_dispatch:

# Накладка прогонов не нужна для корректности (артефакты не конфликтуют
# по имени), но два одновременных прогона расходуют квоту впустую.
concurrency:
  group: daily-backup
  cancel-in-progress: false

# `contents: write` больше НЕ нужен: коммита в репозиторий не происходит.
# Права не выдаются без причины.

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Собрать json и контракт API
        run: |
          set -euo pipefail
          rm -rf backup
          mkdir -p backup

          # find, а не два glob: под docs/api/v1/schemas лежат ещё два json
          # (index.schema.json, supplements.schema.json), и плоский glob их
          # не видит. Список файлов не ведётся — новый json под docs/
          # попадёт в бэкап сам.
          mapfile -t FILES < <(find docs -type f \
                               \( -name '*.json' -o -name 'openapi.yaml' \) \
                               | sort)
          COUNT=${#FILES[@]}
          echo "Найдено файлов: ${COUNT}"

          # Проверка не по счётчику, а по списку обязательных файлов.
          # Порог «меньше 20» не работает: при пропаже openapi.yaml остаётся
          # ровно 20, порог проходит, и бэкап молча становится неполным —
          # ровно то, что страховка обязана ловить. Проверено на этой машине:
          # с порогом тест ПРОХОДИЛ при удалённом файле.
          REQUIRED=(
            docs/data.json
            docs/data_index.json
            docs/timeseries.json
            docs/graph_data.json
            docs/interactions_graph.json
            docs/api/v1/index.json
            docs/api/v1/supplements.json
            docs/api/v1/openapi.yaml
          )
          MISSING=()
          for req in "${REQUIRED[@]}"; do
            [ -f "$req" ] || MISSING+=("$req")
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::обязательные файлы отсутствуют, бэкап был бы неполным:"
            printf '  - %s\n' "${MISSING[@]}"
            exit 1
          fi
          echo "Все ${#REQUIRED[@]} обязательных файлов на месте"

          # --parents сохраняет путь внутри артефакта. Без него все файлы
          # лягут в один каталог, и одинаковое имя из docs/ и docs/api/v1/
          # перезапишет друг друга без предупреждения.
          for f in "${FILES[@]}"; do
            cp --parents "$f" backup/
          done

          # Сверка: сколько скопировано против сколько найдено. Молчаливое
          # расхождение означало бы, что часть источников не попала в архив.
          COPIED=$(find backup -type f | wc -l)
          echo "Скопировано: ${COPIED}"
          if [ "$COPIED" -ne "$COUNT" ]; then
            echo "::error::скопировано ${COPIED} из ${COUNT} — список источников изменился при копировании"
            exit 1
          fi
          du -sh backup/
          find backup -type f | sort

      - name: Загрузить в Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: brain-25-backup-${{ github.run_number }}
          path: backup/
          retention-days: 30
          # По умолчанию warn: при warn пустой архив считался бы успешным
          # бэкапом, и пропажа данных выглядела бы как зелёная галка.
          if-no-files-found: error
