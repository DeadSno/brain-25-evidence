name: tests
on:
  push:
    branches: [main, v1.3-dev, v1.3.1-dev]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pandas requests
      - run: python -m pytest tests/ -q