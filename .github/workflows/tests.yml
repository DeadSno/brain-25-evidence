name: tests

on:
  # v5.4.2 (2026-10-04): джоб snapshots снят, в CI остался pytest. Ветка
  # v5.1-dev убрана из push.branches ещё в v5.4.1 — там джоб был красным
  # всегда. В pull_request ветка оставлена: PR к ней запускает проверку
  # сознательно, человек сделал это руками и результат увидит.
  #
  # 2026-10-07: добавлена v5.6-dev, убрана v5.1-dev из обоих списков.
  # Причина, измеренная на этой ветке: ветки v5.6-dev в списке не было,
  # поэтому CI не запускался на ней вообще — вся работа шагов DATA_P1_FIX,
  # DATA_LIVE_RUN, DATA_COMMIT и DOCS_COMMIT проверялась только локальным
  # pytest. Ветка v5.1-dev числилась с v5.4.1 как остаток и была мёртвой.
  push:
    branches: [main, v5.6-dev]
  pull_request:
    branches: [main, v5.6-dev]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      # v5.6.0 этап 5: fetch-depth: 0 обязателен для шага «Sitemap check».
      # По умолчанию checkout даёт depth 1, и тогда `git log -1 -- docs/...`
      # у любого файла возвращает дату HEAD, а не дату правки самого файла.
      # Генератор sitemap берёт lastmod именно из даты правки, поэтому на
      # неполной истории все 143 записи схлопываются в дату коммита и
      # `--check` падает на расхождении, которого нет на самом деле.
      # Проверено клоном --depth 1: 143 URL в файле против 143 у генератора,
      # но все lastmod = дата HEAD.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run tests
        run: python -m pytest -q --no-header

      # v5.6.0 этап 5: sitemap.xml генерируется из фактического содержимого
      # docs/, поэтому он имеет право разойтись с ним — так уже случилось
      # (17 URL в файле при 143 существующих). Проверка ловит это до пуша.
      - name: Sitemap check
        run: python scripts/build_sitemap.py --check

      # Фид собран тем же способом, и по той же причине: его тоже нужно
      # проверять на расхождение, а не только пересобирать вручную.
      - name: Feed check
        run: python scripts/build_feed.py --check

  # ─────────────────────────── визуальные снапшоты ───────────────────────────
  # Сняты из CI 2026-10-04 (v5.4.2). Эталоны привязаны к конкретной
  # Windows-машине: метрики шрифтов, субпиксельное позиционирование и
  # сглаживание зависят от платформы. Под раннер ubuntu их пришлось бы
  # снимать заново отдельным набором, а запас по порогу нулевой
  # (DIFF_TOL_PCT = 0.05%), так что первый прогон был бы красным по
  # платформенным причинам, а не по коду. Красная отметка, которая ничего
  # не проверяет, хуже её отсутствия — тот же урок, что «не нашёл
  # селектор ≠ мёртвый код».
  #
  # Тесты остались и работают локально, это 73 снимка на 38.94 МБ:
  #   $env:RUN_SNAPSHOTS="1"; pytest -q -m snapshots
  # Гейт срабатывает по переменной окружения (tests/conftest.py), поэтому в
  # обычном `pytest -q` их нет. Переснять базу:
  #   $env:UPDATE_SNAPSHOTS="1"; $env:RUN_SNAPSHOTS="1"; pytest -q -m snapshots
  # Проверить, что снапшоты выполнились, а не молча пропустились
  # (importorskip иначе вернул бы 0 при пустом прогоне):
  #   python scripts/check_snapshot_run.py snapshots.xml
  #
  # Вернуть джоб, когда появится Windows-runner с поднятыми эталонами.
