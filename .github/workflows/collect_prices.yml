name: collect-wb-prices
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas
      - run: python scripts/collect_prices.py
      - name: Commit history
        run: |
          git config user.name "price-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/raw/prices_wb_history.csv || true
          git diff --cached --quiet || git commit -m "data: daily WB prices $(date +%F)"
          git push