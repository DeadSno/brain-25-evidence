[pytest]
testpaths = tests
markers =
    snapshots: визуальные эталоны (tests/test_visual_snapshots.py). Нужен
        браузер и локальный сервер, полный прогон ~100 с против ~4 с без них.
        По умолчанию ВЫКЛЮЧЕНЫ через pytest_collection_modifyitems в
        tests/conftest.py (переменная окружения), а не через `-m` в addopts:
        командная строка `-m "..."` перекрывает addopts, и любая другая `-m`
        возвращала бы 37 тяжёлых тестов в быстрый прогон. Тесты УДАЛЯЮТСЯ из
        коллекции, а не помечаются skipif, — иначе collect-only насчитал бы
        их, и test_version_json_counts_match_reality упал бы.
        Запуск: RUN_SNAPSHOTS=1 pytest -q -m snapshots
        (перезапись: $env:UPDATE_SNAPSHOTS="1"; ...)
    a11y: WCAG 2.2 через axe-core (tests/test_a11y_axe.py). Нужен браузер и
        локальный сервер, 18 страниц x 2 разрешения. Гейт на переменной
        окружения (tests/conftest.py, снятие из коллекции), а не через `-m` в
        addopts: командная строка `-m "..."` перекрывает addopts и вернула бы
        тяжёлые тесты в быстрый прогон. Маркер отдельный от `snapshots` — это
        отдельный гейт с отдельной командой.
        Запуск: RUN_A11Y=1 pytest -q -m a11y
        Переснять базу: UPDATE_A11Y_BASELINE=1 RUN_A11Y=1 pytest -q -m a11y
    e2e: браузерные end-to-end тесты (scripts/e2e_smoke.py, scripts/ui_verify.py).
        Долгие: поднимают http.server и Chromium. По умолчанию ВЫКЛЮЧЕНЫ через
        pytest_collection_modifyitems в tests/conftest.py, а не через `-m` в
        addopts: командная строка `-m "..."` перекрывает addopts и включала бы
        e2e неожиданно. Запуск: RUN_E2E=1 pytest -q -m e2e
    tabs: клик по вкладкам действительно переключает (tests/test_tabs_interaction.py).
        # Требует сервера на :8000 и браузеров Playwright, поэтому снят настройкой
        # в tests/conftest.py по той же причине, что и e2e. 42 теста: 10 на пару
        # движок x страница (4 пары) и 1 на движок (2 движка).
        # Существует из-за поломки, которую не видно на снимках: при расхождении
        # селектора в JS с разметкой страница выглядит ровно так же, а кнопка
        # перестаёт работать. Так было с dataset.tab в v5.4.1 - см.
        # reports/RENAME_TAB.md, раздел 3.1.
        # Запуск: RUN_TABS=1 pytest -q -m tabs
# Маркер `network` удалён 2026-10-01 (QA_AUDIT P1): ни один тест в tests/
# не обращается к сети (проверено: requests/urllib/httpx/http.client/urlopen/
# socket/aiohttp — 0 совпадений), поэтому `-m "not network"` ничего не
# исключал, а сама команда в README/CI/отчётах читалась как «сетевые тесты
# отключены». Если сетевой тест появится — пометьте его `network` и верните
# `-m "not network"` в addopts.
#
# ВНИМАНИЕ, e2e на 2026-10-01 не проходят: ui_verify.py ждёт бейдж `.noPrice`,
# который удалён коммитом a1f1653 вместе с ценой. Это устаревшее утверждение
# в скрипте, а не регресс сайта.
# `-q` убран из addopts 2026-10-01: он дублировался с `-q` из команды
# (`pytest -q` -> `-qq`) и прогон переставал печатать итоговую сводку.
# CI передаёт `-q` явно (.github/workflows/tests.yml), локально удобно видеть
# строку «N passed, M skipped».
addopts = --strict-markers
