[pytest]
testpaths = tests
markers =
    snapshots: визуальные эталоны (tests/test_visual_snapshots.py). Нужен
        браузер и локальный сервер; полный прогон ~200 с против ~4 с без них.
        РАНЬШЕ выключались переменной окружения RUN_SNAPSHOTS (в v5.6.5 это
        снято, см. ниже). Запускаются обычным `pytest -q`; отдельно —
        `pytest -q -m snapshots`.
        Перезапись эталонов: `$env:UPDATE_SNAPSHOTS="1"; pytest -q -m snapshots`
    a11y: WCAG 2.2 через axe-core (tests/test_a11y_axe.py). Нужен браузер и
        локальный сервер, 18 страниц x 2 разрешения (~145 с).
        Запускаются обычным `pytest -q`; отдельно — `pytest -q -m a11y`.
        Переснять базу: `$env:UPDATE_A11Y_BASELINE="1"; pytest -q -m a11y`
    e2e: браузерные end-to-end тесты (scripts/e2e_smoke.py, scripts/ui_verify.py).
        Поднимают свой http.server на :8123 и Chromium. Запускаются обычным
        `pytest -q`; отдельно — `pytest -q -m e2e`.
    tabs: клик по вкладкам действительно переключает (tests/test_tabs_interaction.py).
        Существует из-за поломки, которую не видно на снимках: при расхождении
        селектора в JS с разметкой страница выглядит ровно так же, а кнопка
        перестаёт работать. Так было с dataset.tab в v5.4.1 - см.
        reports/RENAME_TAB.md, раздел 3.1. Требует сервера на :8000.
    graph: отрисовка графа связей в hactar.html (tests/test_graph_interaction.py).
        Существует из-за поломки, которую не видно нигде: при разошедшемся
        селекторе или неподнятом vis-network граф молча остаётся пустым — ни
        ошибки, ни картинки. Найдено негативным контролем в v5.4.1 (тогда — на
        экспорте PNG; экспорт остался в удалённой interactions.html, в Hactar
        его нет, и тест-метка в файле держит эту дыру открытой). Проверяет
        canvas, его размеры и непустые пиксели. Требует сервера на :8000.
    mobile375: проверка отсутствия горизонтального overflow на 375px
        (tests/test_mobile_375.py). Нужен браузер и локальный сервер.
    snapshot_data: слепок docs/data.json (tests/test_snapshot.py). ИСКЛЮЧЁН из
        pre-commit hook: hook смотрит рабочее дерево, а тест сравнивает слепок с
        файлом данных, поэтому любое осознанное обновление данных (например
        scripts/build_key_sources.py) блокировало коммит и требовало сначала
        переснять слепок — то есть в одном коммите менять и данные, и эталон.
        Тест остаётся в обычном прогоне `pytest -q` и в CI: вне hook он и нужен,
        чтобы ловить незаметную мутацию данных.
        Переснять: `$env:UPDATE_SNAPSHOT="1"; pytest -q -m snapshot_data`
#
# v5.6.5 (19.10.2026): ГЕЙТЫ ПО ПЕРЕМЕННЫМ ОКРУЖЕНИЯ ИЗ tests/conftest.py
# УДАЛЕНЫ. Причина — задача «247 skipped»: `pytest -q` показывал 235–262
# skipped, и это читалось как успех, хотя большая часть браузерных тестов
# просто не собиралась. Теперь `pytest -q` запускает ВСЁ, включая snapshots,
# a11y, tabs, graph, mobile375 и e2e; сервер :8000 поднимает autouse-фикстура
# live_server, один sync_playwright() на сессию даёт фикстура
# playwright_instance.
#
# Подмножества теперь задаются обычным `-m`:
#     pytest -q -m "not snapshots"        # всё, кроме эталонов
#     pytest -q -m a11y                   # только доступность
#     pytest -q -m "not (snapshots or a11y or tabs or graph or mobile375 or e2e)"
#                                         # быстрый прогон без браузера
#
# Полный `pytest -q` идёт ~8–10 минут: снапшоты ~200 с, a11y ~145 с,
# e2e ~42 с, tabs+graph ~50 с.
# Маркер `network` удалён 2026-10-01 (QA_AUDIT P1): ни один тест в tests/
# не обращается к сети (проверено: requests/urllib/httpx/http.client/urlopen/
# socket/aiohttp — 0 совпадений), поэтому `-m "not network"` ничего не
# исключал, а сама команда в README/CI/отчётах читалась как «сетевые тесты
# отключены». Если сетевой тест появится — пометьте его `network` и верните
# `-m "not network"` в addopts.
#
# v5.6.5 (19.10.2026): устаревшее утверждение про e2e снято. `ui_verify.py`
# и `e2e_smoke.py` починены: проверялся бейдж `.noPrice`, удалённый вместе с
# ценой (a1f1653), и 15 блоков карточки вместо 14 (блок «Цена» удалён в
# 883a53c). Оба теста проходят: `pytest -q -m e2e` -> 2 passed.
# `-q` убран из addopts 2026-10-01: он дублировался с `-q` из команды
# (`pytest -q` -> `-qq`) и прогон переставал печатать итоговую сводку.
# CI передаёт `-q` явно (.github/workflows/tests.yml), локально удобно видеть
# строку «N passed, M skipped».
addopts = --strict-markers
